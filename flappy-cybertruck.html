<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Cybertruck — Tesla Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: pointer;
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>

<canvas id="game"></canvas>

<script>
// ─── Canvas Setup ───
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 480;
const H = 720;
canvas.width = W;
canvas.height = H;

// ─── Game Constants ───
const GRAVITY = 0.45;
const FLAP_FORCE = -7.5;
const PIPE_WIDTH = 72;
const PIPE_GAP = 175;
const PIPE_SPEED = 2.8;
const PIPE_INTERVAL = 1700; // ms
const GROUND_HEIGHT = 70;
const ROAD_Y = H - GROUND_HEIGHT;

// ─── Game State ───
let state = 'start'; // start | playing | gameover
let score = 0;
let highScore = parseInt(localStorage.getItem('flappyCybertruckHigh') || '0');
let truck = null;
let pipes = [];
let particles = [];
let sparks = [];
let lastPipeTime = 0;
let frameCount = 0;
let stars = [];
let buildings = [];
let groundOffset = 0;
let screenShake = 0;
let flashAlpha = 0;

// ═══════════════════════════════════════════════════════
// ─── 8-BIT SYNTHWAVE AUDIO ENGINE (Web Audio API) ───
// ═══════════════════════════════════════════════════════
let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;
let musicPlaying = false;
let musicTimers = [];

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Master output
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.7;
    masterGain.connect(audioCtx.destination);

    // Music bus
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.55;
    musicGain.connect(masterGain);

    // SFX bus
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.8;
    sfxGain.connect(masterGain);
}

// ─── Utility: play a single tone ───
function playTone(freq, type, gainVal, start, duration, destination, detune) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    if (detune) osc.detune.value = detune;
    g.gain.setValueAtTime(0.001, start);
    g.gain.linearRampToValueAtTime(gainVal, start + 0.01);
    g.gain.setValueAtTime(gainVal, start + duration - 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, start + duration);
    osc.connect(g);
    g.connect(destination || musicGain);
    osc.start(start);
    osc.stop(start + duration + 0.05);
}

// ─── Utility: noise burst (for drums) ───
function playNoise(gainVal, start, duration, filterFreq, destination) {
    if (!audioCtx) return;
    const bufSize = audioCtx.sampleRate * duration;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'highpass';
    filt.frequency.value = filterFreq || 7000;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(gainVal, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + duration);
    src.connect(filt);
    filt.connect(g);
    g.connect(destination || musicGain);
    src.start(start);
    src.stop(start + duration + 0.05);
}

// ─── Drum: Kick ───
function playKick(start) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, start);
    osc.frequency.exponentialRampToValueAtTime(30, start + 0.12);
    g.gain.setValueAtTime(0.7, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
    osc.connect(g);
    g.connect(musicGain);
    osc.start(start);
    osc.stop(start + 0.25);
}

// ─── Drum: Snare ───
function playSnare(start) {
    if (!audioCtx) return;
    // Tone body
    const osc = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 180;
    g1.gain.setValueAtTime(0.35, start);
    g1.gain.exponentialRampToValueAtTime(0.001, start + 0.1);
    osc.connect(g1);
    g1.connect(musicGain);
    osc.start(start);
    osc.stop(start + 0.15);
    // Noise
    playNoise(0.3, start, 0.12, 3000);
}

// ─── Drum: Hi-hat ───
function playHihat(start, open) {
    playNoise(open ? 0.12 : 0.08, start, open ? 0.15 : 0.05, 9000);
}

// ════════════════════════════════════════
// ─── SYNTHWAVE MUSIC SEQUENCER ───
// ════════════════════════════════════════
const BPM = 128;
const BEAT = 60 / BPM; // seconds per beat
const BAR = BEAT * 4;   // seconds per bar

// Key of A minor / C major — moody synthwave
// Note frequencies
const NOTE = {
    'A2': 110.00, 'B2': 123.47, 'C3': 130.81, 'D3': 146.83, 'E3': 164.81,
    'F3': 174.61, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
    'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
    'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
    'C5': 523.25, 'D5': 587.33, 'E5': 659.26, 'F5': 698.46,
    'G5': 783.99, 'A5': 880.00
};

// Bass line pattern (per bar) — driving 8th note synth bass
const bassPatterns = [
    // Bar 1: Am
    ['A2','A2','A2','A2','A2','A2','E3','E3'],
    // Bar 2: F
    ['F3','F3','F3','F3','F3','F3','C3','C3'],
    // Bar 3: C
    ['C3','C3','C3','C3','C3','C3','G3','G3'],
    // Bar 4: G -> Am
    ['G3','G3','G3','G3','E3','E3','A2','A2']
];

// Arpeggio patterns (16th notes per bar)
const arpPatterns = [
    // Bar 1: Am arp
    ['A4','C5','E5','C5', 'A4','C5','E5','C5', 'A4','C5','E5','C5', 'A4','E5','C5','A4'],
    // Bar 2: F maj arp
    ['F4','A4','C5','A4', 'F4','A4','C5','A4', 'F4','A4','C5','F5', 'C5','A4','F4','A4'],
    // Bar 3: C maj arp
    ['C4','E4','G4','E4', 'C4','E4','G4','C5', 'E4','G4','C5','G4', 'E4','C4','G4','E4'],
    // Bar 4: G -> Am
    ['G4','B4','D5','B4', 'G4','B4','D5','G5', 'A4','C5','E5','C5', 'A4','E5','A5','E5']
];

// Pad chords (whole notes, layered)
const padChords = [
    ['A3', 'C4', 'E4'],     // Am
    ['F3', 'A3', 'C4'],     // F
    ['C3', 'E3', 'G3'],     // C
    ['G3', 'B3', 'D4']      // G
];

// Lead melody (plays every other 4-bar cycle) - quarter + 8th notes
const leadMelody = [
    // Bar 1
    { note: 'E5', pos: 0, dur: 1.5 },
    { note: 'D5', pos: 1.5, dur: 0.5 },
    { note: 'C5', pos: 2, dur: 1 },
    { note: 'A4', pos: 3, dur: 1 },
    // Bar 2
    { note: 'A4', pos: 4, dur: 1.5 },
    { note: 'G4', pos: 5.5, dur: 0.5 },
    { note: 'F4', pos: 6, dur: 1.5 },
    { note: 'E4', pos: 7.5, dur: 0.5 },
    // Bar 3
    { note: 'E4', pos: 8, dur: 1 },
    { note: 'G4', pos: 9, dur: 1 },
    { note: 'C5', pos: 10, dur: 1.5 },
    { note: 'B4', pos: 11.5, dur: 0.5 },
    // Bar 4
    { note: 'A4', pos: 12, dur: 2 },
    { note: 'G4', pos: 14, dur: 1 },
    { note: 'A4', pos: 15, dur: 1 }
];

let scheduleAhead = 0.15; // seconds to schedule ahead
let musicStartTime = 0;
let currentBeat = 0;
let nextBeatTime = 0;
let cycleCount = 0;

function startMusic() {
    if (!audioCtx || musicPlaying) return;
    musicPlaying = true;
    musicStartTime = audioCtx.currentTime + 0.1;
    currentBeat = 0;
    nextBeatTime = musicStartTime;
    cycleCount = 0;
    scheduleMusicLoop();
}

function stopMusic() {
    musicPlaying = false;
    musicTimers.forEach(t => clearTimeout(t));
    musicTimers = [];
    // Fade out
    if (musicGain) {
        musicGain.gain.linearRampToValueAtTime(0.0, audioCtx.currentTime + 0.5);
        setTimeout(() => {
            if (musicGain) musicGain.gain.value = 0.55;
        }, 600);
    }
}

function scheduleMusicLoop() {
    if (!musicPlaying) return;

    while (nextBeatTime < audioCtx.currentTime + scheduleAhead) {
        scheduleBar(nextBeatTime, currentBeat);
        currentBeat++;
        if (currentBeat % 4 === 0) cycleCount++;
        nextBeatTime += BAR;
    }

    const timer = setTimeout(scheduleMusicLoop, 50);
    musicTimers.push(timer);
}

function scheduleBar(barStart, barIndex) {
    const patIdx = barIndex % 4;

    // ── Bass (8th notes — 8 per bar) ──
    const bassNotes = bassPatterns[patIdx];
    for (let i = 0; i < 8; i++) {
        const t = barStart + i * (BEAT / 2);
        const freq = NOTE[bassNotes[i]];
        playTone(freq, 'sawtooth', 0.18, t, BEAT / 2 - 0.02, musicGain, 0);
        // Sub octave layer
        playTone(freq / 2, 'square', 0.08, t, BEAT / 2 - 0.02, musicGain, 0);
    }

    // ── Arpeggios (16th notes — 16 per bar) ──
    const arpNotes = arpPatterns[patIdx];
    for (let i = 0; i < 16; i++) {
        const t = barStart + i * (BEAT / 4);
        const freq = NOTE[arpNotes[i]];
        playTone(freq, 'square', 0.06, t, BEAT / 4 - 0.01, musicGain, 8);
        // Slight detuned layer for richness
        playTone(freq, 'square', 0.04, t, BEAT / 4 - 0.01, musicGain, -8);
    }

    // ── Pad (whole bar sustain) ──
    const chord = padChords[patIdx];
    chord.forEach(n => {
        const freq = NOTE[n];
        // Warm triangle pad
        playTone(freq, 'triangle', 0.05, barStart, BAR - 0.05, musicGain, 5);
        playTone(freq, 'sine', 0.03, barStart, BAR - 0.05, musicGain, -3);
    });

    // ── Drums ──
    for (let beat = 0; beat < 4; beat++) {
        const t = barStart + beat * BEAT;
        // Kick on every beat
        playKick(t);
        // Snare on beats 2 & 4
        if (beat === 1 || beat === 3) {
            playSnare(t);
        }
        // Hi-hats on 8th notes
        playHihat(t, false);
        playHihat(t + BEAT / 2, beat === 3); // open hat at end
    }

    // ── Lead melody (every other 4-bar cycle) ──
    if (cycleCount % 2 === 1) {
        leadMelody.forEach(m => {
            // Only play notes that belong to this bar
            const noteBarIndex = Math.floor(m.pos / 4);
            if (noteBarIndex === patIdx) {
                const posInBar = m.pos - noteBarIndex * 4;
                const t = barStart + posInBar * BEAT;
                const dur = m.dur * BEAT;
                const freq = NOTE[m.note];
                // 8-bit lead with pulse-like sound
                playTone(freq, 'square', 0.09, t, dur - 0.02, musicGain, 0);
                // Octave shimmer
                playTone(freq * 2, 'sine', 0.025, t, dur - 0.02, musicGain, 0);
            }
        });
    }
}

// ════════════════════════════════════════
// ─── SOUND EFFECTS ───
// ════════════════════════════════════════

function sfxBoost() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    // Punchy 8-bit thrust: quick pitch sweep up
    const osc1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    osc1.type = 'square';
    osc1.frequency.setValueAtTime(180, now);
    osc1.frequency.exponentialRampToValueAtTime(600, now + 0.06);
    osc1.frequency.exponentialRampToValueAtTime(350, now + 0.12);
    g1.gain.setValueAtTime(0.2, now);
    g1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc1.connect(g1);
    g1.connect(sfxGain);
    osc1.start(now);
    osc1.stop(now + 0.18);

    // Secondary whoosh layer
    const osc2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    osc2.type = 'sawtooth';
    osc2.frequency.setValueAtTime(120, now);
    osc2.frequency.exponentialRampToValueAtTime(280, now + 0.04);
    osc2.frequency.exponentialRampToValueAtTime(80, now + 0.12);
    g2.gain.setValueAtTime(0.1, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc2.connect(g2);
    g2.connect(sfxGain);
    osc2.start(now);
    osc2.stop(now + 0.15);
}

function sfxScore() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    // Cheerful 8-bit coin / point jingle: ascending arpeggio
    const notes = [523.25, 659.26, 783.99, 1046.50]; // C5, E5, G5, C6
    notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        const t = now + i * 0.05;
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.15, t + 0.01);
        g.gain.setValueAtTime(0.15, t + 0.06);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(g);
        g.connect(sfxGain);
        osc.start(t);
        osc.stop(t + 0.22);
    });

    // Shimmer overlay
    const shimmer = audioCtx.createOscillator();
    const sg = audioCtx.createGain();
    shimmer.type = 'sine';
    shimmer.frequency.value = 1567.98; // G6
    sg.gain.setValueAtTime(0.06, now);
    sg.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    shimmer.connect(sg);
    sg.connect(sfxGain);
    shimmer.start(now);
    shimmer.stop(now + 0.35);
}

function sfxCrash() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    // Heavy 8-bit explosion: descending noise + tone
    // Tone crunch
    const osc1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(300, now);
    osc1.frequency.exponentialRampToValueAtTime(40, now + 0.4);
    g1.gain.setValueAtTime(0.35, now);
    g1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc1.connect(g1);
    g1.connect(sfxGain);
    osc1.start(now);
    osc1.stop(now + 0.55);

    // Distorted square crunch
    const osc2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(200, now);
    osc2.frequency.exponentialRampToValueAtTime(25, now + 0.35);
    g2.gain.setValueAtTime(0.25, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc2.connect(g2);
    g2.connect(sfxGain);
    osc2.start(now);
    osc2.stop(now + 0.45);

    // Noise burst (debris)
    const bufSize = audioCtx.sampleRate * 0.5;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = buf;
    const nf = audioCtx.createBiquadFilter();
    nf.type = 'lowpass';
    nf.frequency.setValueAtTime(4000, now);
    nf.frequency.exponentialRampToValueAtTime(200, now + 0.4);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.3, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    noiseSrc.connect(nf);
    nf.connect(ng);
    ng.connect(sfxGain);
    noiseSrc.start(now);
    noiseSrc.stop(now + 0.55);

    // Low sub-boom
    const sub = audioCtx.createOscillator();
    const sg = audioCtx.createGain();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(80, now);
    sub.frequency.exponentialRampToValueAtTime(20, now + 0.3);
    sg.gain.setValueAtTime(0.4, now);
    sg.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    sub.connect(sg);
    sg.connect(sfxGain);
    sub.start(now);
    sub.stop(now + 0.45);
}

function sfxStartGame() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    // Power-up sweep: ascending 8-bit fanfare
    const fanfare = [
        { freq: 261.63, t: 0, dur: 0.1 },       // C4
        { freq: 329.63, t: 0.08, dur: 0.1 },     // E4
        { freq: 392.00, t: 0.16, dur: 0.1 },     // G4
        { freq: 523.25, t: 0.24, dur: 0.25 },    // C5 (sustain)
    ];
    fanfare.forEach(n => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = n.freq;
        const t = now + n.t;
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.14, t + 0.01);
        g.gain.setValueAtTime(0.14, t + n.dur - 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, t + n.dur);
        osc.connect(g);
        g.connect(sfxGain);
        osc.start(t);
        osc.stop(t + n.dur + 0.05);
    });
}

function sfxGameOver() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    // Sad descending 8-bit melody
    const notes = [
        { freq: 440.00, t: 0.15, dur: 0.2 },      // A4
        { freq: 392.00, t: 0.35, dur: 0.2 },       // G4
        { freq: 329.63, t: 0.55, dur: 0.2 },       // E4
        { freq: 261.63, t: 0.75, dur: 0.45 },      // C4 (long)
    ];
    notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = n.freq;
        const t = now + n.t;
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.18, t + 0.02);
        g.gain.setValueAtTime(0.18, t + n.dur * 0.7);
        g.gain.exponentialRampToValueAtTime(0.001, t + n.dur);
        osc.connect(g);
        g.connect(sfxGain);
        osc.start(t);
        osc.stop(t + n.dur + 0.05);
    });
}

function sfxHighScore() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    // Triumphant rapid arpeggio cascade
    const cascade = [
        523.25, 659.26, 783.99, 1046.50,
        659.26, 783.99, 1046.50, 1318.51,
        783.99, 1046.50, 1318.51, 1567.98
    ];
    cascade.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        const t = now + 0.6 + i * 0.04;
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.1, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(g);
        g.connect(sfxGain);
        osc.start(t);
        osc.stop(t + 0.2);
    });
}
// ═══════════════════ END AUDIO ENGINE ═══════════════════

// ─── Stars (background) ───
function initStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * (ROAD_Y - 100),
            r: Math.random() * 1.5 + 0.3,
            twinkle: Math.random() * Math.PI * 2
        });
    }
}

// ─── Buildings (background skyline) ───
function initBuildings() {
    buildings = [];
    let x = 0;
    while (x < W + 100) {
        const w = 30 + Math.random() * 50;
        const h = 60 + Math.random() * 200;
        buildings.push({
            x, w, h,
            windows: Math.random() > 0.3,
            color: `hsl(220, ${5 + Math.random() * 10}%, ${8 + Math.random() * 8}%)`
        });
        x += w + Math.random() * 15;
    }
}

// ─── Truck (player) ───
function initTruck() {
    return {
        x: 90,
        y: H / 2 - 30,
        vy: 0,
        rotation: 0,
        width: 64,
        height: 34,
        boosting: false,
        boostTimer: 0,
        alive: true
    };
}

// ─── Drawing Functions ───

function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, ROAD_Y);
    grad.addColorStop(0, '#05050f');
    grad.addColorStop(0.5, '#0c0c24');
    grad.addColorStop(1, '#141432');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, ROAD_Y);
}

function drawStars() {
    stars.forEach(s => {
        const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle + frameCount * 0.02));
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawMoon() {
    const mx = W - 80, my = 80, mr = 35;
    ctx.save();
    ctx.shadowColor = 'rgba(200, 200, 255, 0.3)';
    ctx.shadowBlur = 40;
    const moonGrad = ctx.createRadialGradient(mx - 5, my - 5, 0, mx, my, mr);
    moonGrad.addColorStop(0, '#f0f0ff');
    moonGrad.addColorStop(0.7, '#d0d0e8');
    moonGrad.addColorStop(1, '#aaaacc');
    ctx.fillStyle = moonGrad;
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();
    // Craters
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath(); ctx.arc(mx - 10, my - 8, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 8, my + 5, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx - 3, my + 12, 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function drawBuildings() {
    buildings.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, ROAD_Y - b.h, b.w, b.h);
        // Windows
        if (b.windows) {
            for (let wy = ROAD_Y - b.h + 10; wy < ROAD_Y - 10; wy += 18) {
                for (let wx = b.x + 6; wx < b.x + b.w - 6; wx += 12) {
                    const lit = Math.sin(wx * 13.7 + wy * 7.3) > 0.2;
                    ctx.fillStyle = lit ? 'rgba(255, 220, 100, 0.6)' : 'rgba(50, 50, 80, 0.4)';
                    ctx.fillRect(wx, wy, 6, 10);
                }
            }
        }
        // Rooftop antenna
        if (b.h > 150 && b.w > 35) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(b.x + b.w / 2, ROAD_Y - b.h);
            ctx.lineTo(b.x + b.w / 2, ROAD_Y - b.h - 20);
            ctx.stroke();
            // Red blink
            if (Math.sin(frameCount * 0.05 + b.x) > 0.3) {
                ctx.fillStyle = '#ff3333';
                ctx.shadowColor = '#ff3333';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(b.x + b.w / 2, ROAD_Y - b.h - 20, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
    });
}

function drawRoad() {
    // Asphalt
    const roadGrad = ctx.createLinearGradient(0, ROAD_Y, 0, H);
    roadGrad.addColorStop(0, '#2a2a2a');
    roadGrad.addColorStop(0.15, '#222');
    roadGrad.addColorStop(1, '#1a1a1a');
    ctx.fillStyle = roadGrad;
    ctx.fillRect(0, ROAD_Y, W, GROUND_HEIGHT);

    // Road edge line
    ctx.fillStyle = '#cc0000';
    ctx.fillRect(0, ROAD_Y, W, 3);

    // Dashed center line
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 2;
    ctx.setLineDash([30, 20]);
    ctx.lineDashOffset = -groundOffset;
    ctx.beginPath();
    ctx.moveTo(0, ROAD_Y + GROUND_HEIGHT / 2);
    ctx.lineTo(W, ROAD_Y + GROUND_HEIGHT / 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Bottom curb
    ctx.fillStyle = '#333';
    ctx.fillRect(0, H - 4, W, 4);
}

// ─── Draw Cybertruck ───
function drawCybertruck(t) {
    ctx.save();
    ctx.translate(t.x + t.width / 2, t.y + t.height / 2);

    // Rotation based on velocity
    const targetRot = Math.max(-0.4, Math.min(0.5, t.vy * 0.06));
    t.rotation += (targetRot - t.rotation) * 0.15;
    ctx.rotate(t.rotation);

    const hw = t.width / 2;
    const hh = t.height / 2;

    // ── Boost flame / thruster ──
    if (t.boostTimer > 0) {
        const flameLen = 15 + Math.random() * 20;
        const flameGrad = ctx.createLinearGradient(-hw - flameLen, 0, -hw, 0);
        flameGrad.addColorStop(0, 'rgba(255, 50, 0, 0)');
        flameGrad.addColorStop(0.4, 'rgba(255, 120, 0, 0.7)');
        flameGrad.addColorStop(0.7, 'rgba(0, 150, 255, 0.9)');
        flameGrad.addColorStop(1, 'rgba(100, 200, 255, 1)');
        ctx.fillStyle = flameGrad;
        ctx.beginPath();
        ctx.moveTo(-hw, -hh * 0.4);
        ctx.lineTo(-hw - flameLen, 0);
        ctx.lineTo(-hw, hh * 0.4);
        ctx.closePath();
        ctx.fill();
    }

    // ── Body (angular Cybertruck profile) ──
    ctx.fillStyle = '#b0b0b0';
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1;
    ctx.beginPath();
    // Start from front nose
    ctx.moveTo(hw, hh * 0.1);                    // front tip (slightly above center)
    ctx.lineTo(hw - 8, -hh * 0.3);              // front hood rise
    ctx.lineTo(hw - 20, -hh * 0.75);            // windshield base
    ctx.lineTo(-hw * 0.1, -hh);                 // roof front
    ctx.lineTo(-hw * 0.7, -hh * 0.9);           // roof back
    ctx.lineTo(-hw, -hh * 0.4);                 // tail top
    ctx.lineTo(-hw, hh * 0.5);                  // tail bottom
    ctx.lineTo(-hw * 0.5, hh);                  // underbody back
    ctx.lineTo(hw * 0.4, hh);                   // underbody front
    ctx.lineTo(hw, hh * 0.5);                   // front lower
    ctx.closePath();
    // Metallic gradient fill
    const bodyGrad = ctx.createLinearGradient(0, -hh, 0, hh);
    bodyGrad.addColorStop(0, '#c8c8c8');
    bodyGrad.addColorStop(0.3, '#a0a0a0');
    bodyGrad.addColorStop(0.6, '#b8b8b8');
    bodyGrad.addColorStop(1, '#808080');
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.stroke();

    // ── Windshield ──
    ctx.fillStyle = 'rgba(60, 80, 120, 0.7)';
    ctx.beginPath();
    ctx.moveTo(hw - 20, -hh * 0.70);
    ctx.lineTo(-hw * 0.05, -hh * 0.92);
    ctx.lineTo(-hw * 0.15, -hh * 0.35);
    ctx.lineTo(hw - 14, -hh * 0.22);
    ctx.closePath();
    ctx.fill();

    // ── Rear window ──
    ctx.fillStyle = 'rgba(50, 65, 100, 0.6)';
    ctx.beginPath();
    ctx.moveTo(-hw * 0.1, -hh * 0.92);
    ctx.lineTo(-hw * 0.65, -hh * 0.82);
    ctx.lineTo(-hw * 0.55, -hh * 0.38);
    ctx.lineTo(-hw * 0.18, -hh * 0.37);
    ctx.closePath();
    ctx.fill();

    // ── LED light bar (front) ──
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hw - 1, hh * 0.08);
    ctx.lineTo(hw - 6, -hh * 0.25);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // ── Tail lights ──
    ctx.shadowColor = '#ff2200';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#ff3300';
    ctx.fillRect(-hw, -hh * 0.35, 3, hh * 0.8);
    ctx.shadowBlur = 0;

    // ── Wheels ──
    const wheelR = 6;
    // Front wheel
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(hw * 0.3, hh + 1, wheelR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.arc(hw * 0.3, hh + 1, wheelR - 2, 0, Math.PI * 2);
    ctx.fill();
    // Rear wheel
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(-hw * 0.5, hh + 1, wheelR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.arc(-hw * 0.5, hh + 1, wheelR - 2, 0, Math.PI * 2);
    ctx.fill();

    // ── Tesla "T" badge ──
    ctx.fillStyle = '#cc0000';
    ctx.font = 'bold 8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('T', hw * 0.1, hh * 0.15);

    ctx.restore();
}

// ─── Draw Supercharger Pipe ───
function drawPipe(p) {
    const topPipeBottom = p.gapY;
    const botPipeTop = p.gapY + PIPE_GAP;

    // ── Top pipe (Supercharger column hanging down) ──
    drawChargerColumn(p.x, 0, PIPE_WIDTH, topPipeBottom, false);

    // ── Bottom pipe (Supercharger column rising up) ──
    drawChargerColumn(p.x, botPipeTop, PIPE_WIDTH, ROAD_Y - botPipeTop, true);

    // ── Connector nozzle tips ──
    drawChargerNozzle(p.x, topPipeBottom, false);
    drawChargerNozzle(p.x, botPipeTop, true);
}

function drawChargerColumn(x, y, w, h, isBottom) {
    if (h <= 0) return;

    // Main column
    const colGrad = ctx.createLinearGradient(x, y, x + w, y);
    colGrad.addColorStop(0, '#1a1a1a');
    colGrad.addColorStop(0.2, '#2a2a2a');
    colGrad.addColorStop(0.5, '#3a3a3a');
    colGrad.addColorStop(0.8, '#2a2a2a');
    colGrad.addColorStop(1, '#1a1a1a');
    ctx.fillStyle = colGrad;
    ctx.fillRect(x, y, w, h);

    // Tesla red accent stripe
    ctx.fillStyle = '#cc0000';
    const stripeX = x + w / 2 - 3;
    ctx.fillRect(stripeX, y, 6, h);

    // Subtle glow on stripe
    ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
    ctx.fillRect(stripeX - 4, y, 14, h);

    // Side trim lines
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 6, y);
    ctx.lineTo(x + 6, y + h);
    ctx.moveTo(x + w - 6, y);
    ctx.lineTo(x + w - 6, y + h);
    ctx.stroke();

    // "TESLA" text on column (repeating)
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    const textX = x + w / 2;
    const startY = isBottom ? y + 50 : y + h - 50;
    const step = isBottom ? 80 : -80;
    for (let i = 0; i < 5; i++) {
        const ty = startY + step * i;
        if (ty > y && ty < y + h) {
            ctx.save();
            ctx.translate(textX, ty);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('SUPERCHARGER', 0, 0);
            ctx.restore();
        }
    }
    ctx.restore();

    // Pulse energy line
    const pulseY = y + ((frameCount * 2 + x * 3) % Math.max(h, 1));
    if (pulseY > y && pulseY < y + h) {
        ctx.fillStyle = 'rgba(0, 180, 255, 0.3)';
        ctx.fillRect(x, pulseY, w, 2);
    }
}

function drawChargerNozzle(x, y, isTop) {
    const nw = PIPE_WIDTH + 16;
    const nh = 22;
    const nx = x - 8;
    const ny = isTop ? y - 2 : y - nh + 2;

    // Nozzle body
    const nozGrad = ctx.createLinearGradient(nx, ny, nx, ny + nh);
    nozGrad.addColorStop(0, '#444');
    nozGrad.addColorStop(0.5, '#555');
    nozGrad.addColorStop(1, '#333');
    ctx.fillStyle = nozGrad;

    // Rounded rect
    const r = 4;
    ctx.beginPath();
    ctx.moveTo(nx + r, ny);
    ctx.lineTo(nx + nw - r, ny);
    ctx.quadraticCurveTo(nx + nw, ny, nx + nw, ny + r);
    ctx.lineTo(nx + nw, ny + nh - r);
    ctx.quadraticCurveTo(nx + nw, ny + nh, nx + nw - r, ny + nh);
    ctx.lineTo(nx + r, ny + nh);
    ctx.quadraticCurveTo(nx, ny + nh, nx, ny + nh - r);
    ctx.lineTo(nx, ny + r);
    ctx.quadraticCurveTo(nx, ny, nx + r, ny);
    ctx.closePath();
    ctx.fill();

    // Tesla "T" emblem on nozzle
    ctx.fillStyle = '#cc0000';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('T', nx + nw / 2, ny + nh / 2 + 5);

    // Green charging LEDs
    const ledY = ny + nh / 2;
    for (let i = 0; i < 3; i++) {
        const alpha = Math.sin(frameCount * 0.1 + i * 1.2) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(0, 255, 100, ${0.4 + alpha * 0.6})`;
        ctx.shadowColor = '#00ff66';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(nx + 12 + i * 8, ledY, 2, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;
}

// ─── Particles (boost exhaust) ───
function spawnBoostParticles(t) {
    for (let i = 0; i < 3; i++) {
        particles.push({
            x: t.x - 5,
            y: t.y + t.height / 2 + (Math.random() - 0.5) * 10,
            vx: -2 - Math.random() * 3,
            vy: (Math.random() - 0.5) * 2,
            life: 1,
            size: 3 + Math.random() * 4,
            color: Math.random() > 0.5 ? '0, 150, 255' : '100, 200, 255'
        });
    }
}

function spawnCrashSparks(x, y) {
    for (let i = 0; i < 30; i++) {
        sparks.push({
            x, y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1,
            size: 2 + Math.random() * 3,
            color: Math.random() > 0.4 ? '255, 200, 50' : '255, 100, 30'
        });
    }
}

function updateParticles(arr) {
    for (let i = arr.length - 1; i >= 0; i--) {
        const p = arr[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) arr.splice(i, 1);
    }
}

function drawParticles(arr) {
    arr.forEach(p => {
        ctx.fillStyle = `rgba(${p.color}, ${p.life})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
}

}

// ─── Collision Detection ───
function checkCollision() {
    const t = truck;
    // Shrink hitbox slightly for fairness
    const margin = 6;
    const tx1 = t.x + margin;
    const ty1 = t.y + margin;
    const tx2 = t.x + t.width - margin;
    const ty2 = t.y + t.height - margin;

    // Ground / ceiling
    if (ty2 >= ROAD_Y || ty1 <= 0) return true;

    // Pipes
    for (const p of pipes) {
        const px1 = p.x - 8; // nozzle extends beyond pipe
        const px2 = p.x + PIPE_WIDTH + 8;
        const topBottom = p.gapY;
        const botTop = p.gapY + PIPE_GAP;

        if (tx2 > px1 && tx1 < px2) {
            if (ty1 < topBottom + 5 || ty2 > botTop - 5) {
                return true;
            }
        }
    }
    return false;
}

// ─── Score Check ───
function checkScore() {
    for (const p of pipes) {
        if (!p.scored && p.x + PIPE_WIDTH < truck.x) {
            p.scored = true;
            score++;
            sfxScore();
        }
    }
}

// ─── Game Reset ───
function resetGame() {
    truck = initTruck();
    pipes = [];
    particles = [];
    sparks = [];
    score = 0;
    lastPipeTime = 0;
    screenShake = 0;
    flashAlpha = 0;
}

// ─── Input Handling ───
let muted = false;

function handleInput() {
    // Always ensure audio context is initialized on first user gesture
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    if (state === 'start') {
        state = 'playing';
        resetGame();
        lastPipeTime = performance.now() + 800; // delay first pipe
        sfxStartGame();
        setTimeout(() => startMusic(), 400);
        return;
    }
    if (state === 'gameover') {
        state = 'start';
        return;
    }
    if (state === 'playing' && truck.alive) {
        truck.vy = FLAP_FORCE;
        truck.boostTimer = 10;
        sfxBoost();
    }
}

function toggleMute() {
    muted = !muted;
    if (masterGain) masterGain.gain.value = muted ? 0 : 0.7;
}

canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(); }, { passive: false });
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        handleInput();
    }
    if (e.code === 'KeyM') {
        toggleMute();
    }
});

// ─── Main Game Loop ───
let lastTime = 0;

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min(timestamp - lastTime, 30);
    lastTime = timestamp;
    frameCount++;

    // ── Screen shake ──
    ctx.save();
    if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }

    // ── Draw background ──
    drawSky();
    drawStars();
    drawMoon();
    drawBuildings();

    // ── Update & Draw game elements ──
    if (state === 'playing') {
        const now = performance.now();

        // Truck physics
        truck.vy += GRAVITY;
        truck.y += truck.vy;
        truck.boostTimer = Math.max(0, truck.boostTimer - 1);

        // Boost particles
        if (truck.boostTimer > 0) {
            spawnBoostParticles(truck);
        }

        // Spawn pipes
        if (now - lastPipeTime > PIPE_INTERVAL) {
            const minGapY = 80;
            const maxGapY = ROAD_Y - PIPE_GAP - 80;
            const gapY = minGapY + Math.random() * (maxGapY - minGapY);
            pipes.push({ x: W, gapY, scored: false });
            lastPipeTime = now;
        }

        // Move pipes
        pipes.forEach(p => p.x -= PIPE_SPEED);
        pipes = pipes.filter(p => p.x + PIPE_WIDTH > -20);

        // Move ground
        groundOffset = (groundOffset + PIPE_SPEED) % 50;

        // Check scoring
        checkScore();

        // Check collision
        if (checkCollision()) {
            truck.alive = false;
            state = 'gameover';
            screenShake = 15;
            flashAlpha = 0.8;
            spawnCrashSparks(truck.x + truck.width / 2, truck.y + truck.height / 2);
            stopMusic();
            sfxCrash();
            sfxGameOver();
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyCybertruckHigh', highScore.toString());
                sfxHighScore();
            }
        }
    }

    // Draw pipes
    pipes.forEach(drawPipe);

    // Draw road (on top of pipes)
    drawRoad();

    // Draw particles
    updateParticles(particles);
    drawParticles(particles);
    updateParticles(sparks);
    drawParticles(sparks);

    // Draw truck
    if (truck) {
        drawCybertruck(truck);
    }

    // Draw HUD
    if (state === 'playing') {
        drawScore();
        drawBattery();
        drawMuteIcon();
    }

    // ── Flash effect ──
    if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255, 100, 50, ${flashAlpha})`;
        ctx.fillRect(0, 0, W, H);
        flashAlpha *= 0.92;
        if (flashAlpha < 0.01) flashAlpha = 0;
    }

    ctx.restore(); // end shake transform

    // ── Overlay screens ──
    if (state === 'start') drawStartScreen();
    if (state === 'gameover') drawGameOver();

    requestAnimationFrame(gameLoop);
}

// ─── Init ───
initStars();
initBuildings();
truck = initTruck();

requestAnimationFrame(gameLoop);
</script>
